      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17223a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="70" y="95" fill="#eef2ff" font-family="Arial, sans-serif" font-size="46" font-weight="700">AI SOFTWARE FACTORY</text>
  <text x="72" y="137" fill="#9aa5c4" font-family="Arial, sans-serif" font-size="23">Seven agents. One controlled delivery pipeline.</text>
  <path d="M120 345 H1080" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(120 345)">
