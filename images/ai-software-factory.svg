      <text y="88" fill="#9ddff0" font-size="18">PRODUCT</text>
    </g>
    <g transform="translate(280 345)">
      <circle r="52" fill="#10263a" stroke="#3bc7e6" stroke-width="4"/><text y="8" fill="#eef2ff" font-size="27" font-weight="700">2</text>
      <text y="88" fill="#9ddff0" font-size="18">ARCHITECT</text>
    </g>
    <g transform="translate(440 345)">
      <circle r="52" fill="#13243b" stroke="#61b9e2" stroke-width="4"/><text y="8" fill="#eef2ff" font-size="27" font-weight="700">3</text>
      <text y="88" fill="#aec8ef" font-size="18">PLANNER</text>
    </g>
    <g transform="translate(600 345)">
      <circle r="52" fill="#17223d" stroke="#829fdc" stroke-width="4"/><text y="8" fill="#eef2ff" font-size="27" font-weight="700">4</text>
      <text y="88" fill="#c1bdf3" font-size="18">BUILDER</text>
